<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="/static/home.css">
 
</head>
<body>
    <nav class="navbar">
        <h1>Mi App</h1>
        <div>
            <span id="user-info"></span>
            <button onclick="logout()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <p class="welcome">Bienvenido, <span id="username-display"></span>!</p>

        <div class="card">
            <h2>Usuarios registrados</h2>
            <table>
                <thead><tr>
                    <th>ID</th><th>Usuario</th><th>Email</th><th>Nombre</th>
                </tr></thead>
                <tbody id="users-table">
                    <tr><td colspan="4" class="loading">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="admin-controls" class="admin-panel" style="display:none;">
        <h3>Panel Admin</h3>

        <div class="delete-user-box">
            <input
                type="text"
                id="delete-user-id"
                placeholder="ID del usuario"
            >
                <button onclick="deleteUser()">
                Eliminar usuario
                </button>
        </div>

            <p id="delete-message"></p>
        </div>

        <div class="admin-panel" >
        <h3>Panel Items</h3>
        <div class="delete-user-box">
            <input
                type="text"
                id="delete-item-id"
                placeholder="ID del item"
            >
                <button onclick="deleteItem()">
                Eliminar Item
                </button>
        </div>

            <p id="delete-item-message"></p>
           <div class="create-item-panel">

    <h3>Crear Item</h3>

    <div class="form-group">
        <label>Título</label>

        <input
            type="text"
            id="item-title"
            placeholder="Ej: Notebook"
        >
    </div>

    <div class="form-group">
        <label>Cantidad</label>

        <input
            type="number"
            id="item-cant"
            placeholder="Ej: 5"
        >
    </div>

    <div class="form-group">
        <label>Descripción</label>

        <input
            type="text"
            id="item-description"
            placeholder="Descripción opcional"
        >
    </div>

    <button class="primary-btn" onclick="createItem()">
        Crear Item
    </button>

    <p id="create-item-message"></p>

</div>

    

        <div class="card">
            <h2>Items</h2>
            <table>
                <thead><tr>
                    <th>ID</th><th>Nombre</th><th>Cantidad</th>
                </tr></thead>
                <tbody id="items-list">
                    <tr><td colspan="3" class="loading">Cargando...</td></tr>
                </tbody>
            </table>
            <p id="items-total" style="margin-top: 0.75rem; color: #666; font-size: 0.9rem; font-weight: 600;"></p>
        </div>
    </div>
   <script src="/static/home.js"></script>
</body>
</html>
